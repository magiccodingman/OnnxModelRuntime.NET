name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OnnxModelRuntime.slnx
      - name: Build
        run: dotnet build OnnxModelRuntime.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/OnnxModelRuntime.Tests/OnnxModelRuntime.Tests.csproj --configuration Release --no-build
